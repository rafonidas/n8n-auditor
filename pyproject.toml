[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-auditor"
version = "0.1.0"
description = "Static + AI analyzer for n8n workflows: security, reliability and governance findings. Semgrep for n8n workflows, with an LLM reviewer on top."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rafael Nunez" }]
keywords = ["n8n", "audit", "security", "linter", "workflows"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
n8n-auditor = "n8n_auditor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = [
    "B008",  # typer.Option/Argument in defaults is the typer idiom
    "E501",  # long lines in rule descriptions/CLI help are fine
    "B904",  # typer.Exit inside except blocks is intentional
    "B007",  # unpacking tuples with unused members reads better than _renames
    "SIM102", "SIM103", "SIM105", "SIM108",  # explicit ifs preferred over one-liners here
]

[tool.ruff.lint.per-file-ignores]
"evals/run_llm_eval.py" = ["E402"]  # sys.path bootstrap before imports

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -s"
